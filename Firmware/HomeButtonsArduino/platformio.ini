; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; This fork targets Home Buttons Original (model A1) only. The mini, pro and
; industrial environments from upstream have been removed.
;
; Device settings live in [esp32_base] rather than [env] so they are not
; inherited by the host-side [env:native] test environment, which has no
; board, framework or flash layout.

[esp32_base]
build_unflags = -std=gnu++11
platform = espressif32@6.8.0
board = homebuttons_rev1.0
framework = arduino, espidf
upload_protocol = esptool
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
extra_scripts =
	pre:pre_script.py
	post:post_script.py
lib_deps =
	bblanchon/ArduinoJson@6.21.5
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	zinggjm/GxEPD2@1.5.8
	ricmoo/QRCode@0.0.1
	olikraus/U8g2_for_Adafruit_GFX@1.8.0
	https://github.com/Neargye/semver.git#v0.3.0

[env:original_release]
extends = esp32_base
build_flags =
	 -std=gnu++17
	 -Wno-unknown-pragmas
	 -DARDUINO_ESP32S2_DEV
	 -DCORE_DEBUG_LEVEL=1
	 -DLOGGER_DEFAULT_LOG_LEVEL=ESP_LOG_INFO
	 -DHOME_BUTTONS_ORIGINAL
board_build.cmake_extra_args = -DHOME_BUTTONS_ORIGINAL=ON

[env:original_debug]
extends = esp32_base
debug_tool = cmsis-dap
build_flags =
	 -std=gnu++17
	 -Wno-unknown-pragmas
	 -DARDUINO_ESP32S2_DEV
	 -DCORE_DEBUG_LEVEL=5
	 -DLOGGER_DEFAULT_LOG_LEVEL=ESP_LOG_DEBUG
	 -DHOME_BUTTONS_ORIGINAL
	 -DHOME_BUTTONS_DEBUG
board_build.cmake_extra_args = -DHOME_BUTTONS_ORIGINAL=ON

; Host-side unit tests for the pure-logic modules. reset_schedule is kept
; free of Arduino and ESP-IDF on purpose so its calendar arithmetic can be
; exercised without a device - those bugs would otherwise only surface weeks
; later as "the counter cleared on the wrong day".
;
;   pio test -e native
[env:native]
platform = native
build_flags =
	 -std=gnu++17
	 -I src
; pio test does not link project sources unless asked, and only this
; one translation unit is host-buildable.
test_build_src = true
build_src_filter = +<reset_schedule.cpp>
test_framework = unity
